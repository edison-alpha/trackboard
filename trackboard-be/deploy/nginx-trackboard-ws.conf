# /etc/nginx/sites-available/trackboard-ws.eaco1.xyz   (certbot adds the 443 block and the http redirect)
# Live editing only: Hocuspocus on its own port. The session cookie belongs to the API host, so this host needs none:
# the app sends a short-lived token from GET /api/collab-token instead.
server {
    server_name ws.eaco1.xyz;

    access_log /var/log/nginx/trackboard-ws.access.log;
    error_log  /var/log/nginx/trackboard-ws.error.log;

    location / {
        proxy_pass http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A socket may sit idle between edits; the provider pings well inside this.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 80;
    listen [::]:80;
}
