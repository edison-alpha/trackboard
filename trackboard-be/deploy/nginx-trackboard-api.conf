# /etc/nginx/sites-available/trackboard-api.eaco1.xyz   (certbot adds the 443 block and the http redirect)
# REST API, Google sign-in, file downloads and the AI stream.
server {
    server_name api.eaco1.xyz;

    # Uploads are capped at 10 MB by the API; leave room for the multipart envelope.
    client_max_body_size 12m;

    access_log /var/log/nginx/trackboard-api.access.log;
    error_log  /var/log/nginx/trackboard-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI answer streams; do not hold it back.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    listen 80;
    listen [::]:80;
}
