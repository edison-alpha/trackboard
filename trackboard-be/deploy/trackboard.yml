---
# Run from Semaphore UI (template "Deploy Trackboard BE"). Pulls the monorepo on the VPS, installs dependencies,
# restarts trackboard-backend.service, and waits for /api/health.
- name: Deploy trackboard-be
  hosts: vps
  gather_facts: false
  tasks:
    - name: Run deploy-remote.sh on the VPS
      ansible.builtin.script: "{{ playbook_dir }}/../scripts/deploy-remote.sh"
      register: deploy
    - name: Show deploy output
      ansible.builtin.debug:
        var: deploy.stdout_lines
