version: v1.0
name: Trackboard
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204

# Every push runs the offline tests. Deploy is a manual promotion: press Deploy in Semaphore.
blocks:
  - name: Test
    task:
      jobs:
        - name: packages
          commands:
            - checkout
            - curl -fsSL https://bun.sh/install | bash
            - export PATH="$HOME/.bun/bin:$PATH"
            - cd trackboard-packages && bun install && bun test && bunx tsc --noEmit
        - name: backend
          commands:
            - checkout
            - curl -fsSL https://bun.sh/install | bash
            - export PATH="$HOME/.bun/bin:$PATH"
            - cd trackboard-packages && bun install && cd ../trackboard-be
            - bun install && bun test && bunx tsc --noEmit

promotions:
  - name: Deploy to VPS
    pipeline_file: deploy.yml
    auto_promote:
      when: "false"
